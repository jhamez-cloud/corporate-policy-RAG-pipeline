[project]
name = "policy-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jhamez-cloud", email = "jameskekeli12@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb==0.4.22",
    "dotenv>=0.9.9",
    "en-core-web-sm",
    "google-genai>=2.34.0",
    "huggingface-hub<0.26",
    "langchain==0.1.0",
    "matplotlib==3.7.2",
    "mcp>=2.3.0",
    "numpy>=1.26.0,<2",
    "pandas==2.1.4",
    "rank-bm25==0.2.2",
    "scikit-learn==1.3.2",
    "sentence-transformers==2.2.2",
    "spacy==3.7.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uv>=0.13.6",
]

[project.scripts]
policy-rag = "policy_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
